[workspace]
resolver = "2"
members = ["crates/*", "vendor/zed/*"]
exclude = ["vendor/async-task"]
# `cargo build`/`cargo test` without -p only touch our own crates; vendored Zed crates are
# still compiled as dependencies, but their own test suites are not run.
default-members = ["crates/*"]

[workspace.package]
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Our own crates.
hermes_agent = { path = "crates/agent" }
hermes_llm = { path = "crates/llm" }
hermes_prompts = { path = "crates/prompts" }
hermes_runtime = { path = "crates/runtime" }
hermes_store = { path = "crates/store" }
hermes_tools = { path = "crates/tools" }
markdown = { path = "crates/markdown" }

# Our own choices (anything Zed also uses comes from the generated block below).
# Versions for the Goose-derived crates follow Goose's root Cargo.toml.
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.23.0"
dirs = "7"
ignore = "0.4.34"
include_dir = "0.7"
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde"] }
once_cell = "1.21.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "multipart", "form", "rustls"] }
rmcp = { version = "3.4.1", default-features = false, features = ["schemars", "server", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = { version = "8.11", features = ["include-exclude"] }
similar = "3"
tokio ={ version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
tokio-stream = { version = "0.1.16", features = ["io-util"] }
tokio-util = { version = "0.7.12", features = ["compat", "io", "codec"] }
tracing-futures = { version = "0.2.4", features = ["futures-03"] }
unicode-normalization = "0.1.22"
urlencoding = "2.1"
zstd = "0.14.3"

# Generated by scripts/vendor_zed.py: Zed crates and the third-party versions Zed pins for them.
# BEGIN vendored-zed
accesskit = {version = "0.24.0", features = ["enumn"]}
accesskit_windows = "0.34"
anyhow = "1.0.86"
async-channel = {version = "2.5", default-features = false}
async-task = "4.7"
async-tungstenite = "0.33"
backtrace = "0.3"
bench_metrics = { path = "vendor/zed/bench_metrics" }
bitflags = "2.6.0"
bytes = "1.0"
chrono = {version = "0.4", default-features = false, features = ["std", "serde"]}
collections = { path = "vendor/zed/collections" }
component = { path = "vendor/zed/component" }
criterion = {version = "0.8.2", features = ["html_reports"]}
ctor = "1.0.12"
derive_more = {version = "2.1", features = ["deref", "deref_mut", "from_str"]}
derive_refineable = { path = "vendor/zed/derive_refineable" }
documented = "0.10"
dunce = "1.0"
env_logger = "0.11"
etagere = "0.2"
flume = {version = "0.12", default-features = false, features = ["async"]}
futures = "0.3.34"
futures-concurrency = "7.7.1"
gpui = { path = "vendor/zed/gpui" }
gpui_macros = { path = "vendor/zed/gpui_macros" }
gpui_platform = { path = "vendor/zed/gpui_platform" }
gpui_shared_string = { path = "vendor/zed/gpui_shared_string" }
gpui_util = { path = "vendor/zed/gpui_util" }
gpui_windows = { path = "vendor/zed/gpui_windows" }
hdrhistogram = {version = "7", default-features = false}
heapless = "0.9.2"
heck = "0.5"
http = "1.1"
http-body = "1.0"
http_client = { path = "vendor/zed/http_client" }
icons = { path = "vendor/zed/icons" }
icu_segmenter = {version = "2.3.0", default-features = false, features = ["compiled_data"]}
image = {version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]}
indexmap = {version = "2.7.0", features = ["serde"]}
inventory = "0.3.19"
itertools = "0.14.0"
log = {version = "0.4", default-features = false, features = ["std"]}
menu = { path = "vendor/zed/menu" }
mermaid_render = { path = "vendor/zed/mermaid_render" }
merman = {version = "=0.8.0-alpha.5", default-features = false}
palette = {version = "0.7.5", default-features = false, features = ["std"]}
parking_lot = "0.12.1"
pollster = "0.4.0"
postage = {version = "0.5", default-features = false}
proc-macro2 = "1.0.93"
profiling = "1"
proptest = {version = "1.12.0", features = ["attr-macro"]}
quick-xml = "0.41"
quote = "1.0.9"
rand = {version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"]}
raw-window-handle = "0.6"
rayon = "1.8"
refineable = { path = "vendor/zed/refineable" }
regex = {version = "1.5", default-features = false, features = ["std", "perf"]}
resvg = {version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"]}
rustc-hash = "2.1.0"
scheduler = { path = "vendor/zed/scheduler" }
schemars = {version = "1.0", default-features = false, features = ["std", "indexmap2"]}
serde = {version = "1.0", features = ["rc"]}
serde_json = {version = "1.0.144", features = ["preserve_order", "raw_value"]}
serde_json_lenient = {version = "0.2", features = ["preserve_order", "raw_value"]}
serde_urlencoded = "0.7"
slotmap = "1.0.6"
smallvec = {version = "1.6", features = ["union", "const_new"]}
smol = "2.0"
spin = {version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"]}
stacksafe = "1.0"
strum = {version = "0.28", features = ["derive"]}
sum_tree = { path = "vendor/zed/sum_tree" }
syn = {version = "2.0", default-features = false, features = ["proc-macro"]}
syntax_theme = { path = "vendor/zed/syntax_theme" }
taffy = {version = "=0.15.0", default-features = false}
tempfile = "3.20.0"
theme = { path = "vendor/zed/theme" }
thiserror = "2.0.12"
tracing = "0.1.40"
tracing-subscriber = "0.3"
ui = { path = "vendor/zed/ui" }
ui_macros = { path = "vendor/zed/ui_macros" }
unicode-segmentation = "1.10"
url = "2.2"
usvg = {version = "0.46.0", default-features = false}
uuid = {version = "1.1", features = ["serde"]}
web-time = "1.1.0"
which = "8"
windows = {version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"]}
windows-core = "0.62"
windows-registry = "0.6.0"
zlog = { path = "vendor/zed/zlog" }
ztracing = { path = "vendor/zed/ztracing" }
ztracing_macro = { path = "vendor/zed/ztracing_macro" }
# END vendored-zed

[patch.crates-io]
# Zed's fork of async-task (used by GPUI's scheduler), copied into vendor/async-task.
async-task = { path = "vendor/async-task" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
debug = "limited"

# Proc-macros and hot dependencies are optimized even in debug builds (from Zed's settings):
# it makes debug builds much faster to run at little compile-time cost.
[profile.dev.package]
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
ui_macros = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
