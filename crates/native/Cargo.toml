[package]
name = "hermes-native"
version = "0.4.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "hermes_native"
path = "src/lib.rs"

[[bin]]
name = "hermes-native"
path = "src/main.rs"

[[bin]]
name = "hermes-native-gallery"
path = "src/bin/gallery.rs"

[features]
# The element dump (`dev::dump`, `--dump <file>`, F12): GPUI Kit's observation of named
# elements is compiled in only with its `test-support` feature.
dev = ["gpui-kit/test-support"]
# The snapshot tests: `cargo test -p hermes-native --features snapshots`. GPUI's offscreen
# renderer on Windows is its wgpu one (`gpui-pre-wgpu`'s `WgpuHeadlessRenderer`):
# `gpui-pre-platform` offers it on Linux only, so it is depended on directly.
snapshots = ["dev", "dep:gpui-pre-wgpu", "dep:image"]

[dependencies]
anyhow.workspace = true
# Attached images are stored base64 in the messages; the thread view decodes them for thumbnails.
base64.workspace = true
chrono = { workspace = true, features = ["clock"] }
dirs.workspace = true
# The application layer (docs/native-ui/README.md, "Architecture"): the app's models call it, views never.
hermes_core.workspace = true
# The stored messages' types (a user message's attached images), read by the model's backend only.
hermes_llm.workspace = true
hermes_runtime.workspace = true
hermes_store.workspace = true
# The runtime's `ApprovalMode`, which the composer's mode picker sets (the backend module only).
hermes_tools.workspace = true
# Pinned exactly (AGENTS.md ground rule 3, the GPUI Kit exception); vendor/SOURCES.md records it.
# `syntect` highlights fenced code: GPUI Kit's `tree-sitter` features pull tree-sitter 0.26,
# which Cargo refuses next to crates/highlight's 0.27 (both declare `links = "tree-sitter"`).
gpui-kit = { version = "=0.10.0", features = ["syntect"] }
# The GPUI snapshot crate GPUI Kit 0.10.0 pins (the same exact version), for its offscreen
# renderer; only with `snapshots`.
gpui-pre-wgpu = { version = "=0.3.12", features = ["test-support"], optional = true }
rfd = "0.15"
image = { version = "0.25.1", default-features = false, features = ["png"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
similar.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
hermes_testdir.workspace = true
gpui-kit = { version = "=0.10.0", features = ["syntect", "test-support"] }
# The mock provider of the recorded thread fixture (`thread/recording.rs`), as hermes_core's tests.
wiremock = "0.6"

[lints]
workspace = true
