[package]
name = "hermes-native"
version = "0.4.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "hermes_native"
path = "src/lib.rs"

[[bin]]
name = "hermes-native"
path = "src/main.rs"

[[bin]]
name = "hermes-native-gallery"
path = "src/bin/gallery.rs"

[features]
# The element dump (`dev::dump`, `--dump <file>`, F12): GPUI Kit's observation of named
# elements is compiled in only with its `test-support` feature.
dev = ["gpui-kit/test-support"]
# The snapshot tests: `cargo test -p hermes-native --features snapshots`. GPUI's offscreen
# renderer on Windows is its wgpu one (`gpui-pre-wgpu`'s `WgpuHeadlessRenderer`):
# `gpui-pre-platform` offers it on Linux only, so it is depended on directly.
snapshots = ["dev", "dep:gpui-pre-wgpu", "dep:image"]

[dependencies]
anyhow.workspace = true
# Pinned exactly (AGENTS.md ground rule 3, the GPUI Kit exception); vendor/SOURCES.md records it.
# `syntect` highlights fenced code: GPUI Kit's `tree-sitter` features pull tree-sitter 0.26,
# which Cargo refuses next to crates/highlight's 0.27 (both declare `links = "tree-sitter"`).
gpui-kit = { version = "=0.10.0", features = ["syntect"] }
# The GPUI snapshot crate GPUI Kit 0.10.0 pins (the same exact version), for its offscreen
# renderer; only with `snapshots`.
gpui-pre-wgpu = { version = "=0.3.12", features = ["test-support"], optional = true }
image = { version = "0.25.1", default-features = false, features = ["png"], optional = true }
serde_json.workspace = true

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["syntect", "test-support"] }

[lints]
workspace = true
