[package]
name = "hermes-desktop"
version = "0.2.1"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Hermes's own desktop frontend in a Tauri window, backed by the hermes-rs runtime."

[[bin]]
name = "hermes-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
base64.workspace = true
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
chrono = { workspace = true, features = ["clock"] }
dirs.workspace = true
futures.workspace = true
hermes_agent.workspace = true
hermes_llm.workspace = true
hermes_prompts.workspace = true
hermes_runtime.workspace = true
hermes_store.workspace = true
hermes_tools.workspace = true
hermes_memory.workspace = true
rusqlite.workspace = true
keyring = { version = "3.6.3", features = ["windows-native"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# Windows' own folder dialog for the page's "choose a folder" (what Tauri's dialog plugin uses).
rfd = "0.15"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4"] }
portable-pty = "0.9"
# The window's taskbar and title icons, loaded at the display's exact size (`main.rs`).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
