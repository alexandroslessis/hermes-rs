[package]
name = "hermes_runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Runs agent sessions: assembles the state machine, persists effects, streams events"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["clock"] }
dirs.workspace = true
hermes_agent.workspace = true
futures.workspace = true
uuid = { workspace = true, features = ["v4"] }
hermes_llm.workspace = true
hermes_memory.workspace = true
hermes_prompts.workspace = true
hermes_store.workspace = true
hermes_tools.workspace = true
parking_lot.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-io"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
image.workspace = true
base64.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
wiremock = "0.6"
