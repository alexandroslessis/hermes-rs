[package]
name = "markdown"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Zed's markdown renderer (crates/markdown), adapted: local language shim, pluggable code highlighting"

[lints]
workspace = true

[lib]
path = "src/markdown.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
collections.workspace = true
gpui.workspace = true
gpui_util.workspace = true
mermaid_render.workspace = true
html5ever = "0.39"
linkify = "0.10.0"
log.workspace = true
markup5ever_rcdom = "0.39"
pulldown-cmark = { version = "0.13.0", default-features = false }
smallvec.workspace = true
stacksafe.workspace = true
sum_tree.workspace = true
syntax_theme.workspace = true
theme.workspace = true
ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
